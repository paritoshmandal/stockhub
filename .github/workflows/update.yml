name: Update StockHub data

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install packages
        run: pip install requests yfinance
      - name: Run robot
        run: python update_data.py
      - name: Commit changes
        run: |
          git config user.name "stockhub-bot"
          git config user.email "stockhub-bot@users.noreply.github.com"
          git add results.json announcements.json
          git diff --staged --quiet || git commit -m "Auto update data"
          git push
